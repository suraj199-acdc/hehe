<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY BABY✦</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow1"></div>
    <div class="background-glow glow2"></div>
    <div class="background-glow glow3"></div>

    <div class="container">

        <div class="glass-card">

            <h1 id="title">SANUUUUUUU</h1>

            <button id="startBtn">
                PRESS TO LESSSGOOO BBG
            </button>

        </div>

    </div>

    <div id="messages"></div>

    <script>
        const button = document.getElementById("startBtn");
        const messages = document.getElementById("messages");
        const title = document.getElementById("title");

        button.addEventListener("click", () => {

            // Change the heading when the button is pressed
            title.textContent = "FOR YOU BABY 💗";

            button.disabled = true;
            button.textContent = "LESSSS GOOOO...";

            let count = 0;
            const total = 1000;

            function generateBatch() {

                for (let i = 0; i < 100 && count < total; i++) {

                    count++;

                    const message = document.createElement("div");

                    message.className = "cute-text";
                    message.textContent = "I LOVE YOU SOOOO MUCHHH 💗";

                    const x = Math.random() * 90 + 5;
                    const y = Math.random() * 90 + 5;

                    message.style.left = x + "%";
                    message.style.top = y + "%";

                    const rotation = Math.random() * 16 - 8;

                    message.style.setProperty(
                        "--rotation",
                        rotation + "deg"
                    );

                    message.style.animationDelay =
                        Math.random() * 0.5 + "s";

                    messages.appendChild(message);
                }

                if (count < total) {

                    setTimeout(generateBatch, 30);

                } else {

                    button.textContent =
                        "SHE IS THE CUTEST. PERIOD. 💖";

                    button.disabled = false;
                }
            }

            generateBatch();

        });
    </script>

</body>
</html>
